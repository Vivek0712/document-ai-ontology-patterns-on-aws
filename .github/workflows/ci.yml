# Continuous integration. Runs with NO AWS credentials, by design:
#   - Python: ruff, pytest (AWS calls are mocked with moto), contract drift check
#   - Quickstart: the documented offline path on a clean checkout (PII=local pipeline, X-ray fixtures,
#     lending-only UI mock world, UI mock build), with no Amazon Bedrock recordings
#   - UI: type check, unit tests and a production build in mock mode
#   - Infra: tsc, jest and `cdk synth` with a placeholder account passed as context
#   - Secrets: gitleaks over the full history, gitleaks rule self-test, private denylist (required on main),
#     PDF/image metadata, size and generated-path guard
#   - Docs: relative links, anchors and cited run ids
#
# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
#
# Nothing here deploys. There are no deploy credentials, OIDC roles or AWS secrets in this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC: catches new gitleaks findings and dependency drift

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Paths. If the repository keeps the UI at ./ui instead of the use-case folder, change UI_DIR.
  UI_DIR: usecases/provenant/ui
  INFRA_DIR: infra
  # Belt and braces: make any accidental real AWS call fail fast instead of finding credentials.
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_SESSION_TOKEN: testing
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/requirements*.txt

      - name: Create the virtual environment
        run: make venv PY=python

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Build and check the ontology
        run: make ontology-check

      - name: Tests (pytest, moto)
        run: .venv/bin/python -m pytest

      - name: Docs - links, anchors and cited run ids
        run: python3 scripts/dev/check-doc-links.py

      - name: Contract schemas are in sync with the models
        run: |
          make contracts
          git diff --exit-code -- contracts/generated \
            || { echo "::error::contracts/generated is stale. Run 'make contracts' and commit the result."; exit 1; }

  # ---------------------------------------------------------------------------
  quickstart:
    name: Offline quickstart (no AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/requirements*.txt

      - name: Create the virtual environment
        run: make venv PY=python

      - name: Local pipeline, both lanes, through `ready` (local PII stand-in)
        run: make e2e-local PII=local

      - name: Show the unit diff summary
        if: always()
        run: |
          if [ -f build/e2e/diff.md ]; then head -n 60 build/e2e/diff.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Quickstart 1, step 8: the UI mock world from the lending build alone. Logged runs of the packages that
      # `make e2e-packages` builds (it needs Amazon Bedrock) are skipped and counted, never an error.
      - name: X-ray fixtures and the lending-only mock world
        run: |
          make xray-fixtures
          make mock-world | tee mock-world.log
          test -s "${UI_DIR}/mock-public/mock/world.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - name: UI mock build over the lending-only mock world
        working-directory: ${{ env.UI_DIR }}
        run: |
          npm ci
          npm run build:mock

  # ---------------------------------------------------------------------------
  ui:
    name: UI type check, tests and mock build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.UI_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # The mock world is generated locally by `make mock-world` (not committed; about 69 MB in full).
        # Tests that need it are skipped when it is missing; the quickstart job builds the UI over the
        # lending-only world.
        env:
          RP_ALLOW_MISSING_FIXTURES: "1"
        run: npm test

      - name: Production build in mock mode
        run: npm run build:mock

  # ---------------------------------------------------------------------------
  infra:
    name: CDK type check, tests and synth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.INFRA_DIR }}/package-lock.json

      - name: Install
        working-directory: ${{ env.INFRA_DIR }}
        run: npm ci

      - name: Type check
        working-directory: ${{ env.INFRA_DIR }}
        run: npx tsc --noEmit

      - name: Unit tests (jest, stub build tree, placeholder account)
        working-directory: ${{ env.INFRA_DIR }}
        run: npx jest

      - name: Package Lambda code and layers (no Docker)
        run: PY=python scripts/build_lambdas.sh

      - name: cdk synth with a placeholder account
        working-directory: ${{ env.INFRA_DIR }}
        # The account is a documented placeholder. Synth makes no AWS calls: Availability Zones are
        # passed as context, so no lookups run.
        run: >-
          npx --no-install cdk synth --all --quiet
          -c rp:account=000000000000
          -c rp:region=us-east-1

      - name: Synthesized templates contain no real account id
        working-directory: ${{ env.INFRA_DIR }}
        env:
          # Placeholders, plus any AWS-owned service account id a construct embeds (add with a comment).
          ALLOWED: "000000000000|111111111111|123456789012"
        run: |
          # Never print the numbers themselves: this log is public. Print a masked form and the file names.
          hits="$(grep -R -o -E '\b[0-9]{12}\b' cdk.out --include='*.template.json' \
            | grep -v -E ":(${ALLOWED})\$" | sort -u || true)"
          if [ -n "${hits}" ]; then
            echo "::error::$(printf '%s\n' "${hits}" | wc -l | tr -d ' ') non-placeholder 12-digit number(s) in cdk.out templates:"
            printf '%s\n' "${hits}" | sed -E 's/:[0-9]{8}([0-9]{4})$/: ********\1/'
            exit 1
          fi

  # ---------------------------------------------------------------------------
  secrets:
    name: Secret and identifier scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${tarball}" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks, full history (values redacted in logs)
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner

      - name: gitleaks, working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: gitleaks project rules, positive and negative controls
        run: bash scripts/dev/test-gitleaks-rules.sh gitleaks

      - name: PDF and image metadata
        run: python3 scripts/dev/check-binary-metadata.py

      - name: No release placeholders left (owner, CODEOWNERS handles, contact, date, unresolved verify markers)
        run: bash scripts/dev/check-release-placeholders.sh

      - name: Private denylist (required on main and the schedule; file names and counts only)
        # Maintainers store exact strings that must never appear (for example an account id or a personal
        # name) in the repository secret PRIVATE_DENYLIST, one per line. The step runs on pushes to main, the
        # weekly schedule and manual runs, and FAILS when the secret is missing there (--require), so an
        # unset secret cannot pass silently. It never runs on pull requests (forks get no secrets, and
        # pull-request code never runs with the secret); the push to main after a merge checks the result.
        # The history scan covers file contents, commit messages and author/committer identities. The
        # maintainers' public GitHub handle is allowed only in CODEOWNERS entries, links to this repository
        # and a noreply commit identity whose display name is the handle (see the script).
        if: github.event_name != 'pull_request'
        env:
          DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: |
          bash scripts/dev/check-denylist.sh --require
          bash scripts/dev/check-denylist.sh --require --history
          DENYLIST="${DENYLIST}" python3 scripts/dev/check-binary-metadata.py

      - name: No tracked file over 1 MiB, no generated or local-only paths
        run: |
          set -euo pipefail
          big="$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 1048576 {print}')"
          if [ -n "${big}" ]; then echo "::error::Files over 1 MiB are tracked:"; echo "${big}"; exit 1; fi
          bad="$(git ls-files | grep -E '(^|/)(cdk\.out|build|node_modules|\.venv|internal|private|audit|mock-public)/|(^|/)ui/dist/|(^|/)cdk\.context\.json$|(^|/)\.env$|\.egg-info/|\.DS_Store$|(^|/)public/config\.json$' || true)"
          if [ -n "${bad}" ]; then echo "::error::Generated or local-only paths are tracked:"; echo "${bad}"; exit 1; fi
          exported="$(git ls-files -- runs | grep -v '^runs/local/' || true)"
          if [ -n "${exported}" ]; then echo "::error::Only runs/local/ may be tracked under runs/ (exported AWS runs hold real ids):"; echo "${exported}"; exit 1; fi
